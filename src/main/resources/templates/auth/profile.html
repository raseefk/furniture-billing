<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile | MMD Furniture House</title>
    <th:block th:insert="~{fragments/layout :: headStyles}"></th:block>
</head>
<body>
<div class="app-layout">
    <div th:insert="~{fragments/layout :: sidebar}"></div>
    <div class="main-col">
        <div th:insert="~{fragments/layout :: topbar('My Profile')}"></div>
        <div th:insert="~{fragments/layout :: alerts}"></div>
        <div class="page-content">
            <div style="max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:20px;">
                <div class="card">
                    <div style="display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid #f0f0f0;margin-bottom:16px;">
                        <div style="width:64px;height:64px;background:#b8860b;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:white;" th:text="${#strings.substring(user.fullName,0,1).toUpperCase()}"></div>
                        <div>
                            <div style="font-size:20px;font-weight:700;color:#0f3460;" th:text="${user.fullName}"></div>
                            <div style="color:#6b7280;font-size:14px;" th:text="${user.email}"></div>
                            <span class="badge badge-yellow" style="margin-top:6px;" th:text="${user.role.replace('ROLE_','')}"></span>
                        </div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:14px;">
                        <div><div style="color:#9ca3af;font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:4px;">Username</div><div style="font-weight:600;color:#0f3460;font-family:monospace;" th:text="${user.username}"></div></div>
                        <div><div style="color:#9ca3af;font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:4px;">Last Login</div><div style="font-weight:600;" th:text="${user.lastLogin!=null?#temporals.format(user.lastLogin,'dd MMM yyyy, HH:mm'):'First login'}"></div></div>
                        <div><div style="color:#9ca3af;font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:4px;">Account Created</div><div style="font-weight:600;" th:text="${#temporals.format(user.createdAt,'dd MMM yyyy')}"></div></div>
                        <div><div style="color:#9ca3af;font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:4px;">Status</div><span class="badge badge-green">Active</span></div>
                    </div>
                </div>
                <div class="card" x-data="{s1:false,s2:false,s3:false}">
                    <h3 style="font-size:16px;font-weight:700;color:#0f3460;margin-bottom:16px;">Change Password</h3>
                    <form th:action="@{/profile/change-password}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="form-group">
                            <label class="form-label">Current Password</label>
                            <div style="position:relative;">
                                <input :type="s1?'text':'password'" name="currentPassword" class="form-input" style="padding-right:40px;" required/>
                                <button type="button" @click="s1=!s1" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9ca3af;">👁</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <div style="position:relative;">
                                <input :type="s2?'text':'password'" name="newPassword" minlength="6" class="form-input" style="padding-right:40px;" required/>
                                <button type="button" @click="s2=!s2" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9ca3af;">👁</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Confirm New Password</label>
                            <div style="position:relative;">
                                <input :type="s3?'text':'password'" name="confirmPassword" class="form-input" style="padding-right:40px;" required/>
                                <button type="button" @click="s3=!s3" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9ca3af;">👁</button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-gold">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="page-footer">&copy; 2024 MMD Furniture House Management System</div>
    </div>
</div>
<th:block th:insert="~{fragments/layout :: clockScript}"></th:block>
</body>
</html>
