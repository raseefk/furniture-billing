<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle + ' | MMD Furniture House'}">Customer</title>
    <th:block th:insert="~{fragments/layout :: headStyles}"></th:block>
</head>
<body>
<div class="app-layout">
    <div th:insert="~{fragments/layout :: sidebar}"></div>
    <div class="main-col">
        <div th:insert="~{fragments/layout :: topbar(${pageTitle})}"></div>
        <div th:insert="~{fragments/layout :: alerts}"></div>
        <div class="page-content">
            <div style="max-width:620px;margin:0 auto;">
                <div class="card">
                    <div style="display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid #f0f0f0;margin-bottom:20px;">
                        <div style="width:40px;height:40px;background:#ecfdf5;border-radius:10px;display:flex;align-items:center;justify-content:center;">
                            <svg width="20" height="20" fill="none" stroke="#16a34a" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                        </div>
                        <div>
                            <h2 style="font-size:18px;font-weight:700;color:#0f3460;" th:text="${pageTitle}"></h2>
                            <p style="color:#9ca3af;font-size:13px;">Fields marked * are required</p>
                        </div>
                    </div>
                    <form th:action="@{/customers/save}" method="post" th:object="${customer}" x-data="{hasGst: /*[[${customer.gstNumber != null and !#strings.isEmpty(customer.gstNumber?:'')}]]*/ false}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" th:field="*{id}"/>
                        <div class="form-group">
                            <label class="form-label">Full Name / Company Name *</label>
                            <input type="text" th:field="*{name}" class="form-input" th:classappend="${#fields.hasErrors('name')}?' error':''" placeholder="e.g. Rahul Sharma"/>
                            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="form-error"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Mobile Number *</label>
                            <input type="tel" th:field="*{phone}" class="form-input" th:classappend="${#fields.hasErrors('phone')}?' error':''" placeholder="9876543210" maxlength="10"/>
                            <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="form-error"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Address *</label>
                            <textarea th:field="*{address}" rows="3" class="form-input" style="resize:none;" th:classappend="${#fields.hasErrors('address')}?' error':''" placeholder="Door No., Street, Area, City - PIN"></textarea>
                            <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="form-error"></div>
                        </div>
                        <div class="form-group">
                            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                                <input type="checkbox" id="gst-cb" x-model="hasGst" style="width:16px;height:16px;accent-color:#b8860b;cursor:pointer;"/>
                                <label for="gst-cb" style="font-size:13px;font-weight:600;color:#374151;cursor:pointer;">B2B Customer (has GST Number)</label>
                            </div>
                            <div x-show="hasGst" x-cloak>
                                <input type="text" th:field="*{gstNumber}" class="form-input" style="font-family:monospace;text-transform:uppercase;letter-spacing:2px;" placeholder="29AABCA1234B1ZP" maxlength="15"/>
                                <div style="color:#9ca3af;font-size:11px;margin-top:4px;">15-character GST Identification Number</div>
                            </div>
                        </div>
                        <div style="display:flex;gap:10px;margin-top:20px;">
                            <button type="submit" class="btn btn-gold" th:text="${customer.id==null?'Add Customer':'Update Customer'}"></button>
                            <a th:href="@{/customers}" class="btn btn-ghost">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="page-footer">&copy; 2024 MMD Furniture House Management System</div>
    </div>
</div>
<th:block th:insert="~{fragments/layout :: clockScript}"></th:block>
</body>
</html>
