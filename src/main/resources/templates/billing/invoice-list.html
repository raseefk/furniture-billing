<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle + ' | MMD Furniture House'}">Invoices</title>
    <th:block th:insert="~{fragments/layout :: headStyles}"></th:block>
</head>
<body>
<div class="app-layout">
    <div th:insert="~{fragments/layout :: sidebar}"></div>
    <div class="main-col">
        <div th:insert="~{fragments/layout :: topbar(${pageTitle})}"></div>
        <div th:insert="~{fragments/layout :: alerts}"></div>
        <div class="page-content">

            <!-- Search Bar -->
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
                <div style="color:#6b7280;font-size:14px;">
                    <strong style="color:#0f3460;" th:text="${#lists.size(invoices)}">0</strong> record(s)
                    <span th:if="${query != null and !#strings.isEmpty(query)}"> for "<strong th:text="${query}"></strong>"</span>
                </div>
                <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                    <form th:action="${statusFilter == 'QUOTATION' ? '/billing/quotations' : '/billing/history'}" method="get" style="display:flex;gap:8px;">
                        <input type="text" name="q" th:value="${query}" placeholder="Search name, phone, number..." class="form-input" style="width:260px;"/>
                        <button type="submit" class="btn btn-navy">Search</button>
                        <a th:if="${query != null and !#strings.isEmpty(query)}"
                           th:href="${statusFilter == 'QUOTATION' ? '/billing/quotations' : '/billing/history'}"
                           class="btn btn-ghost">Clear</a>
                    </form>
                    <a th:href="@{/billing/new}" class="btn btn-gold">+ New</a>
                </div>
            </div>

            <!-- Empty -->
            <div th:if="${#lists.isEmpty(invoices)}" class="card" style="text-align:center;padding:64px 24px;">
                <div style="width:64px;height:64px;background:#f3f4f6;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                    <svg width="32" height="32" fill="none" stroke="#d1d5db" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                </div>
                <h3 style="font-size:18px;font-weight:700;color:#9ca3af;margin-bottom:8px;">No Records Found</h3>
                <p style="color:#d1d5db;font-size:14px;margin-bottom:20px;">Create your first one to get started.</p>
                <a th:href="@{/billing/new}" class="btn btn-gold" style="display:inline-flex;">Create New Bill</a>
            </div>

            <!-- Table -->
            <div th:if="${!#lists.isEmpty(invoices)}" class="card" style="padding:0;overflow:hidden;">
                <table>
                    <thead><tr>
                        <th>Invoice No.</th><th>Customer</th><th>Phone</th>
                        <th style="text-align:center;">Items</th>
                        <th style="text-align:right;">Total (₹)</th>
                        <th style="text-align:center;">Status</th>
                        <th>Date</th>
                        <th style="text-align:center;">Actions</th>
                    </tr></thead>
                    <tbody>
                    <tr th:each="inv : ${invoices}">
                        <td><a th:href="@{/billing/view/{id}(id=${inv.id})}" style="color:#b8860b;font-weight:700;text-decoration:none;font-family:monospace;font-size:12px;" th:text="${inv.invoiceNumber}"></a></td>
                        <td style="font-weight:600;color:#111;" th:text="${inv.customer.name}"></td>
                        <td style="color:#6b7280;font-family:monospace;font-size:12px;" th:text="${inv.customer.phone}"></td>
                        <td style="text-align:center;"><span style="background:#e0e7ff;color:#3730a3;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;" th:text="${#lists.size(inv.items)}"></span></td>
                        <td style="text-align:right;font-weight:700;color:#0f3460;font-family:monospace;">₹<span th:text="${#numbers.formatDecimal(inv.grandTotal,1,'COMMA',2,'POINT')}"></span></td>
                        <td style="text-align:center;">
                            <span th:class="${inv.isQuotation() ? 'badge badge-yellow' : inv.isFinalBill() ? 'badge badge-green' : 'badge badge-red'}" th:text="${inv.status.displayName}"></span>
                        </td>
                        <td style="color:#9ca3af;font-size:12px;" th:text="${#temporals.format(inv.createdAt,'dd MMM yyyy')}"></td>
                        <td style="text-align:center;">
                            <div style="display:flex;align-items:center;justify-content:center;gap:4px;">
                                <a th:href="@{/billing/view/{id}(id=${inv.id})}" title="View" style="color:#0f3460;padding:5px;border-radius:6px;text-decoration:none;display:inline-flex;" onmouseover="this.style.background='#e0e7ff'" onmouseout="this.style.background='none'">
                                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                </a>
                                <a th:href="@{/billing/pdf/{id}(id=${inv.id})}" title="PDF" style="color:#dc2626;padding:5px;border-radius:6px;text-decoration:none;display:inline-flex;" onmouseover="this.style.background='#fee2e2'" onmouseout="this.style.background='none'">
                                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                </a>
                                <form th:if="${inv.isQuotation()}" th:action="@{/billing/convert/{id}(id=${inv.id})}" method="post" style="display:inline;" onsubmit="return confirm('Convert to Final Bill? Stock will be deducted.')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" title="Convert to Bill" style="background:none;border:none;color:#16a34a;padding:5px;border-radius:6px;cursor:pointer;display:inline-flex;" onmouseover="this.style.background='#dcfce7'" onmouseout="this.style.background='none'">
                                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
        <div class="page-footer">&copy; 2024 MMD Furniture House Management System</div>
    </div>
</div>
<th:block th:insert="~{fragments/layout :: clockScript}"></th:block>
</body>
</html>
