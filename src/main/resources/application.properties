# ─── Application ───────────────────────────────────────────────────────────────
spring.application.name=Furniture Shop Management System
server.port=8080

# ─── H2 File-Persistent Database ───────────────────────────────────────────────
spring.datasource.url=jdbc:h2:file:${user.dir}/data/furnituredb
spring.datasource.username=admin
spring.datasource.password=furniture@2024

# ─── H2 Console (for debugging) ────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Data Initialization ───────────────────────────────────────────────────────
# Run data.sql after Hibernate creates/updates the schema
spring.jpa.defer-datasource-initialization=true
# 'always' runs data.sql on every start (INSERT uses WHERE NOT EXISTS so it's safe)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data.sql

# ─── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ─── Session ───────────────────────────────────────────────────────────────────
server.servlet.session.timeout=60m

# ─── Multipart ─────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.furnitureshop=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot.autoconfigure.sql=DEBUG

# ─── Shop Branding (used in PDFs and UI) ───────────────────────────────────────
shop.name=MMD Furniture House
