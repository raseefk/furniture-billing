# ─── Application ───────────────────────────────────────────────────────────────
spring.application.name=Furniture Shop Management System
server.port=8083

# ─── Oracle Database ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@(description=(retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=adb.ap-hyderabad-1.oraclecloud.com))(connect_data=(service_name=g0640c7a3df714d_mthjttv6ulke3bjy_high.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))
spring.datasource.username=ADMIN
spring.datasource.password=Royatahrinn8jb$
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Data Initialization ───────────────────────────────────────────────────────
# Run data.sql after Hibernate creates/updates the schema
spring.jpa.defer-datasource-initialization=true
# 'always' runs data.sql on every start (INSERT uses WHERE NOT EXISTS so it's safe)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data.sql

# ─── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ─── Session ───────────────────────────────────────────────────────────────────
server.servlet.session.timeout=60m

# ─── Multipart ─────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.furnitureshop=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot.autoconfigure.sql=DEBUG

