apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: furniture-shop-ingress
spec:
  rules:
  - host: your-domain.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: furniture-shop-service
            port:
              number: 8080